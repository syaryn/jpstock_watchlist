[project]
name = "jpstock-watchlist"
version = "0.1.0"
description = "Japanese stock screening CSV analysis and watchlist scoring tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
]

[project.scripts]
jpstock = "jpstock_watchlist.cli:main"
jpstock-watchlist = "jpstock_watchlist.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ty>=0.0.7",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["jpstock_watchlist"]

[tool.ty.environment]
python-version = "3.14"
python = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpstock_watchlist"]
